<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Примерка ремонта • AI Реновация</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #07080A;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
    }

    .font-heading {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    /* Phone chassis with dark titanium bezel on dark site canvas */
    .phone-mockup {
      box-shadow: 
        0 30px 100px -15px rgba(0, 0, 0, 0.95),
        0 0 0 10px #18191D,
        0 0 0 12px #2A2B30,
        0 0 0 13px rgba(255, 255, 255, 0.08);
    }

    /* Glass tag on photos - clean dark badge */
    .glass-tag {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Slider handle */
    .slider-handle-shadow {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 2px #FFFFFF;
    }

    /* ----------------------------------------------------
       BUTTON INTERACTION (ПУНКТ 4):
       Фон: белый. Текст: чёрный. Без свечения.
       При наведении:
       - появляется чёрный круг;
       - стрелка закрашивается и становится белой;
       - стрелка поворачивается.
    ---------------------------------------------------- */
    .btn-cta {
      background-color: #FFFFFF;
      color: #000000;
      box-shadow: none !important;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .btn-cta:hover {
      background-color: #F4F4F5;
    }
    .btn-cta:active {
      transform: scale(0.985);
    }

    .arrow-icon {
      color: #000000;
      transform: translate(0, 0) scale(1) rotate(0deg);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-cta:hover .arrow-icon {
      transform: translate(5px, 0) scale(1.25) rotate(-45deg);
    }

    /* ----------------------------------------------------
       ANIMATED BORDER BEAM FOR AI PILL (ПУНКТ 5):
       Фон: серый. Текст: светлый.
       По контуру плашки «ездит» белая полоска.
    ---------------------------------------------------- */
    @keyframes border-beam-travel {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -100;
      }
    }
    .beam-stroke {
      animation: border-beam-travel 2.8s linear infinite;
    }
  </style>
</head>

  <!-- Interactive Slider & Bento Mask Geometry Script -->
  <script>
    // ----------------------------------------------------
    // 1. Bento Mask Geometry Engine (ПУНКТ 1: одинаковые отступы; ПУНКТ 2: четкие углы)
    // ----------------------------------------------------
    function updateBentoShape() {
      const card = document.getElementById('bento-container');
      const svg = document.getElementById('bento-svg');
      const path = document.getElementById('bento-path');
      const pill = document.getElementById('ai-pill');
      
      if (!card || !svg || !path || !pill) return;

      const w = card.offsetWidth;
      const h = card.offsetHeight;
      
      const pillW = pill.offsetWidth;
      const pillH = pill.offsetHeight;
      
      // ПУНКТ 1: Расстояние одинаковое везде:
      // GAP_BOTTOM (зеленая линия на схеме) == GAP_RIGHT (оранжевая линия на схеме) == 8px
      const GAP = 8;
      
      const nw = pillW + GAP; // ширина выреза
      const nh = pillH + GAP; // глубина выреза
      
      // ПУНКТ 2: Углы резче, не такими скошенными:
      // r = 16 (внешние углы карточки), r_inner = 10 (вогнутое скругление выреза)
      const r = 16;
      const r_inner = 10;

      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

      // SVG path с точным сопряжением дуг
      const d = [
        `M ${nw + r} 0`,
        `L ${w - r} 0`,
        `A ${r} ${r} 0 0 1 ${w} ${r}`,
        `L ${w} ${h - r}`,
        `A ${r} ${r} 0 0 1 ${w - r} ${h}`,
        `L ${r} ${h}`,
        `A ${r} ${r} 0 0 1 0 ${h - r}`,
        `L 0 ${nh + r}`,
        `A ${r} ${r} 0 0 1 ${r} ${nh}`,
        `L ${nw - r_inner} ${nh}`,
        `A ${r_inner} ${r_inner} 0 0 0 ${nw} ${nh - r_inner}`,
        `L ${nw} ${r}`,
        `A ${r} ${r} 0 0 1 ${nw + r} 0`,
        `Z`
      ].join(' ');

      path.setAttribute('d', d);

      // Beam rect dimensions
      const beamRect = document.getElementById('beam-rect');
      if (beamRect) {
        beamRect.setAttribute('width', (pillW - 1.5) + 'px');
        beamRect.setAttribute('height', (pillH - 1.5) + 'px');
      }
    }

    window.addEventListener('load', updateBentoShape);
    window.addEventListener('resize', updateBentoShape);
    setTimeout(updateBentoShape, 50);

    // ----------------------------------------------------
    // 2. Interactive Before/After Split Slider Engine
    // ----------------------------------------------------
    (function initSlider() {
      const box = document.getElementById('banner-slider-box');
      const beforeImg = document.getElementById('before-image');
      const line = document.getElementById('banner-slider-line');
      const thumb = document.getElementById('banner-slider-thumb');
      
      let isDragging = false;

      function updateSliderPosition(clientX) {
        const rect = box.getBoundingClientRect();
        let posX = clientX - rect.left;
        posX = Math.max(0, Math.min(posX, rect.width));
        const pct = (posX / rect.width) * 100;

        beforeImg.style.clipPath = `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`;
        line.style.left = `${pct}%`;
        thumb.style.left = `${pct}%`;
      }

      function onPointerDown(e) {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updateSliderPosition(clientX);
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updateSliderPosition(clientX);
      }

      function onPointerUp() {
        isDragging = false;
      }

      box.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      box.addEventListener('touchstart', onPointerDown, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);
    })();
  </script>
